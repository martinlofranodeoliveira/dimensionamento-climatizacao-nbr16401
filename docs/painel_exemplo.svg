    <text x="470" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BTU/H</text>
    <rect x="25" y="114" width="550" height="26" rx="2" fill="#152244"/>
    <text x="35" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Condução Envoltória</text>
    <text x="260" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Sensível</text>
    <text x="360" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">4079,0</text>
    <text x="470" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">16187,0</text>
    <rect x="25" y="142" width="550" height="26" rx="2" fill="#1a2a54"/>
    <text x="35" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Radiação Solar Vidros</text>
