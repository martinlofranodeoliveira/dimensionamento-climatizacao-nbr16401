    <text x="360" y="326" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">1890,0</text>
    <text x="470" y="326" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">7500,0</text>

    <!-- Caixa de Totais -->
