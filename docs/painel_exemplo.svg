    <text x="360" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">12059,0</text>
    <text x="470" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">47854,0</text>
    <rect x="25" y="170" width="550" height="26" rx="2" fill="#152244"/>
    <text x="35" y="186" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Ocupantes (Sensível)</text>
    <text x="260" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Sensível</text>
    <text x="360" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">1204,0</text>
    <text x="470" y="186" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">4777,0</text>
    <rect x="25" y="198" width="550" height="26" rx="2" fill="#1a2a54"/>
    <text x="35" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Ocupantes (Latente)</text>
    <text x="260" y="214" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">Latente</text>
    <text x="360" y="214" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">1032,0</text>
    <text x="470" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">4094,0</text>
    <rect x="25" y="226" width="550" height="26" rx="2" fill="#152244"/>
    <text x="35" y="242" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Iluminação Artificial</text>
    <text x="260" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Sensível</text>
    <text x="360" y="242" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">1376,0</text>
    <text x="470" y="242" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">5459,0</text>
    <rect x="25" y="254" width="550" height="26" rx="2" fill="#1a2a54"/>
