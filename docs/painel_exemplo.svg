  <!-- Rodapé Técnico -->
  <text x="720" y="870" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Engenharia Térmica e AVAC • Lofrano Tecnologia 2026 • 100% Aritmética Racional Exata (Zero Float)</text>
