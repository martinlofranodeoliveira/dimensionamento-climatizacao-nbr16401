    <text x="350" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AR INSUFLADO (14°C)</text>
    <text x="350" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">8659,0 m³/h</text>

    <!-- Recinto Climatizado (Zona Ocupada) -->
    <g transform="translate(360, 280)">
      <rect width="330" height="230" rx="10" fill="#0d1b3e" stroke="#2a3f7a" stroke-width="2"/>
      <text x="165" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">RECINTO CONDICIONADO</text>
      <text x="165" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">TBS = 24,0 °C • 50% UR</text>

      <!-- Ícones de Carga Interna -->
      <!-- Ocupantes -->
      <rect x="25" y="80" width="80" height="60" rx="6" fill="#1e2d5a"/>
      <text x="65" y="105" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PESSOAS</text>
      <text x="65" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2236,0 kcal</text>

      <!-- Iluminação -->
      <rect x="125" y="80" width="80" height="60" rx="6" fill="#1e2d5a"/>
      <text x="165" y="105" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ILUMINAÇÃO</text>
      <text x="165" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1376,0 kcal</text>

      <!-- Equipamentos -->
      <rect x="225" y="80" width="80" height="60" rx="6" fill="#1e2d5a"/>
      <text x="265" y="105" fill="#ec4899" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EQUIPAMENTOS</text>
      <text x="265" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2709,0 kcal</text>

      <!-- Carga da Envoltória -->
      <text x="165" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Carga Envoltória (Paredes/Vidros): 16138,0 kcal/h</text>
      <text x="165" y="205" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Conforto Térmico Assegurado NBR 16401-2</text>
    </g>

    <!-- Duto de Retorno -->
    <path d="M 360 420 L 170 420 L 170 260" stroke="#64748b" stroke-width="5" stroke-dasharray="6,4" fill="none"/>
    <text x="240" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ar de Retorno (24°C)</text>
  </g>

