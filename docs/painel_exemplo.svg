    <text x="470" y="270" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">10748,0</text>
    <rect x="25" y="282" width="550" height="26" rx="2" fill="#152244"/>
    <text x="35" y="298" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Ar Externo (Sensível)</text>
    <text x="260" y="298" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Sensível</text>
    <text x="360" y="298" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">1244,0</text>
    <text x="470" y="298" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">4937,0</text>
    <rect x="25" y="310" width="550" height="26" rx="2" fill="#1a2a54"/>
    <text x="35" y="326" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Ar Externo (Latente)</text>
