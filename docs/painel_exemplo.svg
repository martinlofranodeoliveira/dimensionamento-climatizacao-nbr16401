      <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">BALANÇO TÉRMICO COM SEGURANÇA (+10,0%)</text>
      <text x="20" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Calor Sensível Total: <tspan fill="#38bdf8" font-weight="700">24938,0 kcal/h</tspan></text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Calor Latente Total: <tspan fill="#f59e0b" font-weight="700">3214,0 kcal/h</tspan></text>
      <text x="20" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Carga Térmica Total: <tspan fill="#ec4899" font-weight="800">111713,0 BTU/h</tspan> (9,31 TR)</text>
      <line x1="20" y1="130" x2="530" y2="130" stroke="#1e2d5a" stroke-width="1"/>
      <text x="20" y="155" fill="#10b981" font-family="system-ui. sans-serif" font-size="11" font-weight="700">Equipamento Padronizado Recomendado: 120.000 BTU/h (10.00 TR)</text>
