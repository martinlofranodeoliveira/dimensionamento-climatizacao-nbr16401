[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensionamento-climatizacao-nbr16401"
version = "1.0.0"
description = "Motor analítico e CLI para cálculo de carga térmica, renovação de ar e dimensionamento de climatização e ar-condicionado conforme ABNT NBR 16401:2008 em Python puro com aritmética exata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lofrano Tecnologia", email = "contato@lofranotecnologia.com.br" }
]
keywords = [
    "engenharia-mecanica",
    "climatizacao",
    "ar-condicionado",
    "nbr-16401",
    "carga-termica",
    "renovacao-ar",
    "psicrometria",
    "conforto-termico",
    "qualidade-ar",
    "python-puro"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)"
]
dependencies = []

[project.scripts]
climatizacao-nbr16401 = "climatizacao_nbr16401.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climatizacao_nbr16401 = ["py.typed"]
